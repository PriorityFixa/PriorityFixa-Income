<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | PriorityFixa Commerce</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script src="config/business.js"></script>
    <script src="config/branding.js"></script>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-page.js"></script>

</head>


<body>

    <header class="site-header">

        <a
            href="index.html"
            class="brand"
        >
            <span id="business-name">
                PriorityFixa Commerce
            </span>
        </a>


        <nav class="main-nav">

            <a href="index.html">
                Store
            </a>

            <a href="community.html">
                Community
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>

        </nav>

    </header>


    <main>

        <section class="store-hero">

            <p class="eyebrow">
                YOUR ORDER
            </p>

            <h1>
                Shopping Cart
            </h1>

            <p>
                Review your items before checkout.
            </p>

        </section>


        <section class="products-section">

            <div id="cart-container">

                <!-- Cart is inserted here by cart-page.js -->

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <p>
            <span id="footer-business-name">
                PriorityFixa Commerce
            </span>
        </p>

    </footer>

</body>

</html>
