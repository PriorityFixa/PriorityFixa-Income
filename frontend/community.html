<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join Our Community</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/business.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/forms.js" defer></script>
</head>

<body>

    <header class="site-header">

        <a href="index.html" class="brand">
            <span id="business-name">
                PriorityFixa Commerce
            </span>
        </a>

        <nav class="main-nav">
            <a href="index.html">Store</a>
            <a href="events.html">Events</a>
            <a href="community.html">Community</a>
            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>
        </nav>

    </header>


    <main>

        <section class="store-hero">

            <p class="eyebrow">
                COMMUNITY
            </p>

            <h1>
                Join Our Community
            </h1>

            <p id="store-tagline">
                Connect, learn and grow with us.
            </p>

        </section>


        <section class="registration-section">

            <div class="registration-card">

                <h2>
                    Community Registration
                </h2>

                <p>
                    Join our community to receive updates,
                    opportunities and information about upcoming
                    activities and events.
                </p>


                <form id="community-form">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="07XX XXX XXX"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="organisation">
                            Organisation
                        </label>

                        <input
                            type="text"
                            id="organisation"
                            name="organisation"
                            placeholder="Organisation (optional)"
                        >

                    </div>


                    <div class="form-group">

                        <label for="interest">
                            Area of Interest
                        </label>

                        <select
                            id="interest"
                            name="interest"
                        >

                            <option value="">
                                Select an option
                            </option>

                            <option value="business">
                                Business
                            </option>

                            <option value="training">
                                Training
                            </option>

                            <option value="events">
                                Events
                            </option>

                            <option value="networking">
                                Networking
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="add-to-cart"
                    >
                        Join Community
                    </button>


                    <div
                        id="form-message"
                        aria-live="polite"
                    ></div>

                </form>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <p>
            © <span id="footer-business-name">
                PriorityFixa Commerce
            </span>
        </p>

    </footer>

</body>
</html>
