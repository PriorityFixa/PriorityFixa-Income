<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | PriorityFixa Commerce</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- =========================
         CONFIGURATION
    ========================== -->

    <script src="config/business.js"></script>
    <script src="config/branding.js"></script>

    <!-- =========================
         STOREFRONT DATA
    ========================== -->

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
   <!-- <script src="js/checkout.js"></script>-->
    <script src="js/checkout.js?v=2"></script>

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <a
            href="index.html"
            class="brand"
        >
            <span id="business-name">
                PriorityFixa Commerce
            </span>
        </a>


        <nav class="main-nav">

            <a href="index.html">
                Store
            </a>

            <a href="community.html">
                Community
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>

        </nav>

    </header>


    <!-- =========================
         CHECKOUT
    ========================== -->

    <main>

        <section class="store-hero">

            <p class="eyebrow">
                CHECKOUT
            </p>

            <h1>
                Complete Your Order
            </h1>

            <p>
                Enter your details and review your order before payment.
            </p>

        </section>


        <section class="products-section">

            <div class="checkout-grid">


                <!-- =========================
                     CUSTOMER DETAILS
                ========================== -->

                <div class="checkout-form-container">

                    <h2>
                        Customer Details
                    </h2>


                    <form id="checkout-form">


                        <div class="form-group">

                            <label for="customer-name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="customer-name"
                                name="customerName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="customer-phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="customer-phone"
                                name="customerPhone"
                                placeholder="07XXXXXXXX"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="customer-email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="customer-email"
                                name="customerEmail"
                                placeholder="you@example.com"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="customer-location">
                                Location / Delivery Details
                            </label>

                            <textarea
                                id="customer-location"
                                name="customerLocation"
                                rows="4"
                                placeholder="Enter delivery or contact details"
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="add-to-cart"
                        >
                            Continue to Payment
                        </button>


                    </form>

                </div>


                <!-- =========================
                     ORDER SUMMARY
                ========================== -->

                <aside
                    class="checkout-summary"
                    id="checkout-summary"
                >

                    <!-- Order summary inserted by JavaScript -->

                </aside>


            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <p>

            <span id="footer-business-name">
                PriorityFixa Commerce
            </span>

        </p>

    </footer>

</body>

</html>
