<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PriorityFixa Commerce</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- =========================
         CONFIGURATION
    ========================== -->

    <script src="config/business.js"></script>
    <script src="config/branding.js"></script>

    <!-- =========================
         STOREFRONT DATA
    ========================== -->

    <script src="js/products.js"></script>
    <script src="js/storefront.js"></script>

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <a
            href="index.html"
            class="brand"
        >
            <span id="business-name">
                PriorityFixa Commerce
            </span>
        </a>


        <nav class="main-nav">

            <a href="index.html">
                Store
            </a>

            <a href="community.html">
                Community
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>

        </nav>

    </header>


    <!-- =========================
         MAIN STOREFRONT
    ========================== -->

    <main>

        <section class="store-hero">

            <p class="eyebrow">
                ONLINE STORE
            </p>

            <h1 id="store-title">
                Products
            </h1>

            <p id="store-tagline">
                Simple Commerce for Growing Businesses
            </p>

        </section>


        <!-- =========================
             PRODUCTS
        ========================== -->

        <section class="products-section">

            <div
                id="product-grid"
                class="product-grid"
            >
                <!-- Products inserted by JavaScript -->
            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <p>
            <span id="footer-business-name">
                PriorityFixa Commerce
            </span>
        </p>

    </footer>

</body>

</html>
